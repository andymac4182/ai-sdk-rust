[package]
name = "workflow-world"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Rust crate skeleton for the standalone Vercel Workflow world interface package."
license = "Apache-2.0"
repository = "https://github.com/andymac4182/ai-sdk-rust"
readme = "../../README.md"

[lib]
name = "workflow_world"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
time = { version = "0.3.45", features = ["serde", "serde-well-known"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
