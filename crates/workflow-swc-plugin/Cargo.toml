[package]
name = "workflow-swc-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.87.0"
description = "Rust port of the standalone Vercel Workflow SWC transform."
license = "Apache-2.0"
repository = "https://github.com/andymac4182/ai-sdk-rust"
readme = "../../README.md"

[lib]
name = "workflow_swc_plugin"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
swc_common = "=18.0.0"
swc_core = { version = "49.0", features = ["ecma_plugin_transform"] }

[dev-dependencies]
swc_ecma_parser = "28.0"
testing = "19.0"
