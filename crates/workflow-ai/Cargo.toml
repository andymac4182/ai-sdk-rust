[package]
name = "workflow-ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Rust port of the standalone Vercel Workflow AI package."
license = "Apache-2.0"
repository = "https://github.com/andymac4182/ai-sdk-rust"
readme = "../../README.md"

[lib]
name = "workflow_ai"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
ai-sdk-provider = { path = "../ai-sdk-provider" }
ai-sdk-provider-utils = { path = "../ai-sdk-provider-utils" }
ai-sdk-workflow = { path = "../ai-sdk-workflow" }
serde_json = "1.0.149"

[dev-dependencies]
futures-executor = "0.3.32"
