[package]
name = "open-agents-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Service entrypoint skeleton for the Rust Open Agents Slack remote agent."
license = "Apache-2.0"
repository = "https://github.com/andymac4182/ai-sdk-rust"
readme = "../../README.md"

[lib]
name = "open_agents_service"
path = "src/lib.rs"

[[bin]]
name = "open-agents-slack"
path = "src/main.rs"

[[bin]]
name = "healthz"
path = "api/healthz.rs"

[[bin]]
name = "readyz"
path = "api/readyz.rs"

[[bin]]
name = "status"
path = "api/status.rs"

[[bin]]
name = "slack-events"
path = "api/slack/events.rs"

[[bin]]
name = "slack-interactions"
path = "api/slack/interactions.rs"

[[bin]]
name = "slack-commands"
path = "api/slack/commands.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
ai-sdk-rust = { path = "../.." }
ai-sdk-workflow = { path = "../ai-sdk-workflow" }
async-trait = "0.1.89"
chat-sdk-adapter-slack = { path = "../chat-sdk-adapter-slack" }
chat-sdk-chat = { path = "../chat-sdk-chat" }
chat-sdk-state-memory = { path = "../chat-sdk-state-memory" }
http-body-util = "0.1"
open-agents-core = { path = "../open-agents-core" }
open-agents-persistence = { path = "../open-agents-persistence" }
open-agents-runtime = { path = "../open-agents-runtime" }
open-agents-sandbox = { path = "../open-agents-sandbox" }
open-agents-slack = { path = "../open-agents-slack" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
time = { version = "0.3.45", features = ["serde", "serde-well-known"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
vercel_runtime = "2.2.0"

[dev-dependencies]
hmac = "0.12"
sha2 = "0.10"
