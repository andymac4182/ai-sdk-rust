[package]
name = "workflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Rust crate skeleton for the standalone Vercel Workflow SDK facade."
license = "Apache-2.0"
repository = "https://github.com/andymac4182/ai-sdk-rust"
readme = "../../README.md"

[lib]
name = "workflow"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
workflow-core = { path = "../workflow-core" }
workflow-errors = { path = "../workflow-errors" }
workflow-serde = { path = "../workflow-serde" }
workflow-utils = { path = "../workflow-utils" }

[dev-dependencies]
serde_json = "1.0.149"
