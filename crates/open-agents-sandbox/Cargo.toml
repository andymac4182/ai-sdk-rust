[package]
name = "open-agents-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Rust sandbox boundary for Open Agents remote-agent execution."
license = "Apache-2.0"
repository = "https://github.com/andymac4182/ai-sdk-rust"
readme = "../../README.md"

[lib]
name = "open_agents_sandbox"
path = "src/lib.rs"

[features]
default = []
vercel-sandbox = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
flate2 = "1.1.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tar = "0.4.44"
ureq = "3.3.0"
