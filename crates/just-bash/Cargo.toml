[package]
name = "just-bash"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Portable Rust backend primitives for the Just Bash virtual filesystem."
license = "Apache-2.0"
repository = "https://github.com/andymac4182/ai-sdk-rust"
readme = "../../README.md"

[lib]
name = "just_bash"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
md-5 = "0.10"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10"
sha2 = "0.10"
url = { version = "2.5.8", features = ["serde"] }
