[package]
name = "workflow-builders"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Rust port of portable standalone Vercel Workflow builder helpers."
license = "Apache-2.0"
repository = "https://github.com/andymac4182/ai-sdk-rust"
readme = "../../README.md"

[lib]
name = "workflow_builders"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
regex = "1.12.2"
serde_json = "1.0.149"
