[package]
name = "workflow-world-local"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Rust crate skeleton for the standalone Vercel Workflow local world package."
license = "Apache-2.0"
repository = "https://github.com/andymac4182/ai-sdk-rust"
readme = "../../README.md"

[lib]
name = "workflow_world_local"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
base64 = "0.22"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
thiserror = "1.0"
time = { version = "0.3.45", features = ["formatting", "macros", "parsing", "serde", "serde-well-known"] }
workflow-world = { path = "../workflow-world" }

[dev-dependencies]
tempfile = "3.23"
