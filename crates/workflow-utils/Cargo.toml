[package]
name = "workflow-utils"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Rust crate skeleton for the standalone Vercel Workflow utility package."
license = "Apache-2.0"
repository = "https://github.com/andymac4182/ai-sdk-rust"
readme = "../../README.md"

[lib]
name = "workflow_utils"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dev-dependencies]
tempfile = "3.23.0"
