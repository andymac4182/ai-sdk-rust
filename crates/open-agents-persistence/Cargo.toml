[package]
name = "open-agents-persistence"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Persistence contracts for the Rust Open Agents remote-agent service."
license = "Apache-2.0"
repository = "https://github.com/andymac4182/ai-sdk-rust"
readme = "../../README.md"

[lib]
name = "open_agents_persistence"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
async-trait = "0.1.89"
open-agents-core = { path = "../open-agents-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
time = { version = "0.3.45", features = ["serde"] }

[dev-dependencies]
futures-executor = "0.3.32"
